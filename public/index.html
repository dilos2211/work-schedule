<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Шажки к Миллиону</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    
    <!-- Шапка с логотипом, названием и переключателем языков -->
    <div class="header-studio">
      <div class="header-top-row">
        <h1 class="brand-title">Шажки к Миллиону</h1>
        <div class="lang-switch">
          <button id="langRu" class="lang-btn active">RU</button>
          <button id="langPl" class="lang-btn">PL</button>
        </div>
      </div>
      <img src="logo-yy.png" alt="Logo YY" class="header-logo">
    </div>

    <!-- Панель управления датой -->
    <div class="controls-card">
      <div class="controls-row">
        <div class="select-wrapper">
          <label for="monthSelect" data-i18n="monthLabel">Месяц:</label>
          <select id="monthSelect">
            <!-- Заполняется динамически через JS -->
          </select>
        </div>

        <div class="select-wrapper" style="max-width: 100px;">
          <label for="yearSelect" data-i18n="yearLabel">Год:</label>
          <select id="yearSelect">
            <option value="2024">2024</option>
            <option value="2025">2025</option>
            <option value="2026">2026</option>
            <option value="2027">2027</option>
          </select>
        </div>
      </div>

      <button id="todayBtn" class="btn-gold" style="margin-top: 5px;" data-i18n="todayBtn">📅 Текущий месяц</button>
    </div>

    <!-- Финансовый блок -->
    <div class="finance-card">
      <div class="finance-group">
        <label for="calcTypeSelect" data-i18n="calcTypeLabel">Тип оплаты:</label>
        <select id="calcTypeSelect">
          <option value="monthly" data-i18n="optMonthly">Оклад за месяц (zł/мес)</option>
          <option value="hourly" data-i18n="optHourly">Почасовая ставка (zł/ч)</option>
        </select>
      </div>

      <div id="monthlyRateBox" class="finance-group">
        <label for="monthlyRateInput" data-i18n="monthlyRateLabel">Оклад брутто (zł):</label>
        <input type="number" id="monthlyRateInput" value="5800" step="50">
      </div>

      <div id="hourlyRateBox" class="finance-group" style="display: none;">
        <label for="rateInput" data-i18n="hourlyRateLabel">Ставка в час (zł/ч):</label>
        <input type="number" id="rateInput" value="35" step="1">
      </div>

      <div class="finance-group" style="margin-top: 10px;">
        <label for="bonusInput" data-i18n="bonusLabel">Премия брутто (zł):</label>
        <input type="number" id="bonusInput" value="0" step="10">
      </div>
    </div>

    <!-- Календарь -->
    <div class="calendar-card">
      <div id="weekdaysGrid" class="weekdays-grid">
        <!-- Дни недели заполняются через JS -->
      </div>
      <div id="calendarGrid" class="calendar-grid">
        <!-- Дни генерируются через JS -->
      </div>
    </div>

    <!-- Статус сообщения -->
    <div id="statusMsg" class="status-msg"></div>

    <!-- Итоги / Сводка -->
    <div class="summary-card">
      <div class="summary-row">
        <span data-i18n="sumDays">Отработано дней:</span>
        <span id="totalShifts">0</span>
      </div>
      <div class="summary-row">
        <span data-i18n="sumBaseHours">Базовые часы:</span>
        <span id="totalBaseHours">0 ч (из 0ч)</span>
      </div>
      <div class="summary-row">
        <span data-i18n="sumOvertime">Переработка (Nadgodziny):</span>
        <span id="totalOvertimeHours" style="color: #f59e0b;">0 ч</span>
      </div>
      <div class="summary-row">
        <span data-i18n="sumAllHours">Всего часов:</span>
        <span id="totalAllHours">0 ч</span>
      </div>
      <div class="summary-row total">
        <span data-i18n="sumGross">Ориентировочно брутто:</span>
        <span id="totalGrossEarned">0.00 zł</span>
      </div>
    </div>

    <button id="saveBtn" class="btn-gold" style="width: 100%; padding: 14px; font-size: 15px; margin-bottom: 30px;" data-i18n="saveBtn">Сохранить отчет</button>

  </div>

  <!-- Модальное окно настройки дня -->
  <div id="dayModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modalTitle">Настройка дня</span>
        <button id="modalClose" class="modal-close">&times;</button>
      </div>

      <div class="modal-body">
        <!-- Баннер праздника -->
        <div id="modalHolidayBanner" class="modal-holiday-info"></div>

        <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 6px;" data-i18n="quickSelectLabel">Быстрый выбор смены:</div>
        <div class="quick-shifts">
          <button class="btn-quick" data-shift="1" data-i18n="shift1Btn">1 смена</button>
          <button class="btn-quick" data-shift="2" data-i18n="shift2Btn">2 смена</button>
          <button class="btn-quick" data-shift="3" data-i18n="shift3Btn">3 смена</button>
          <button class="btn-quick" data-shift="none" data-i18n="shiftOffBtn">Выходной</button>
        </div>

        <div class="time-inputs-group">
          <div class="time-field">
            <label for="startTime" data-i18n="timeStart">Начало:</label>
            <input type="time" id="startTime">
          </div>
          <div class="time-field">
            <label for="endTime" data-i18n="timeEnd">Конец:</label>
            <input type="time" id="endTime">
          </div>
        </div>

        <div id="overtimePreview" class="overtime-preview" data-i18n="dayOffText">
          Выходной день
        </div>

        <button id="modalSaveBtn" class="btn-gold" style="width: 100%;" data-i18n="applyBtn">Применить</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
