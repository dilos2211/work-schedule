<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Учет смен и сверхурочных</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="brand-container">
        <div>
          <h2>Учет смен и сверхурочных (KP Polska)</h2>
          <p class="subtitle">Клик по ячейке — выбор смены / точная настройка времени</p>
        </div>
      </div>

      <div class="controls-bar">
        <div class="form-group inline">
          <label for="monthSelect">Месяц:</label>
          <select id="monthSelect">
            <option value="0">Январь</option>
            <option value="1">Февраль</option>
            <option value="2">Март</option>
            <option value="3">Апрель</option>
            <option value="4">Май</option>
            <option value="5">Июнь</option>
            <option value="6">Июль</option>
            <option value="7">Август</option>
            <option value="8">Сентябрь</option>
            <option value="9">Октябрь</option>
            <option value="10">Ноябрь</option>
            <option value="11">Декабрь</option>
          </select>
        </div>
        <div class="form-group inline">
          <label for="yearSelect">Год:</label>
          <input type="number" id="yearSelect" value="2026" min="2020" max="2035" style="width: 80px;">
        </div>
        <button id="todayBtn" class="btn-today" title="Перейти к текущему месяцу">📅 Текущий месяц</button>
      </div>
    </div>

    <!-- Панель фин. настроек -->
    <div class="finance-inputs-bar">
      <div class="finance-group">
        <label for="calcTypeSelect">Тип оплаты:</label>
        <select id="calcTypeSelect" style="font-weight: 600;">
          <option value="hourly">Почасовая ставка (zł/ч)</option>
          <option value="monthly" selected>Оклад за месяц (zł/мес)</option>
        </select>
      </div>

      <div class="finance-group" id="monthlyRateBox">
        <label for="monthlyRateInput">Оклад брутто (zł):</label>
        <input type="number" id="monthlyRateInput" step="0.01" min="0" placeholder="4300.00">
      </div>

      <div class="finance-group" id="hourlyRateBox" style="display: none;">
        <label for="rateInput">Ставка брутто (zł/ч):</label>
        <input type="number" id="rateInput" step="0.01" min="0" placeholder="30.00">
      </div>

      <div class="finance-group">
        <label for="bonusInput">Премия брутто (zł):</label>
        <input type="number" id="bonusInput" step="0.01" min="0" placeholder="0.00">
      </div>
    </div>

    <!-- Заголовки дней недели -->
    <div class="weekdays-grid">
      <div>Пн</div>
      <div>Вт</div>
      <div>Ср</div>
      <div>Чт</div>
      <div>Пт</div>
      <div>Сб</div>
      <div>Вс</div>
    </div>

    <!-- Сетка дней календаря -->
    <div id="calendarGrid" class="calendar-grid"></div>

    <!-- Сводка за месяц -->
    <div class="summary-card">
      <div class="summary-item">
        <span>Отработано дней:</span>
        <strong id="totalShifts">0</strong>
      </div>
      <div class="summary-item">
        <span>Базовые часы:</span>
        <strong id="totalBaseHours">0 ч</strong>
      </div>
      <div class="summary-item highlight-overtime">
        <span>Переработка (Nadgodziny):</span>
        <strong id="totalOvertimeHours">0 ч</strong>
      </div>
      <div class="summary-item highlight-total">
        <span>Всего часов:</span>
        <strong id="totalAllHours">0 ч</strong>
      </div>
      <div class="summary-item highlight-money">
        <span>Ориентировочно брутто:</span>
        <strong id="totalGrossEarned">0.00 zł</strong>
      </div>
    </div>

    <div class="actions">
      <button id="saveBtn" class="btn-submit">Сохранить отчет</button>
    </div>
    <div id="statusMsg" class="status-msg"></div>
  </div>

  <!-- Модальное окно настройки смены -->
  <div id="dayModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Настройка смены</h3>
        <span id="modalClose" class="modal-close">&times;</span>
      </div>
      
      <div class="modal-body">
        <label class="section-label">Быстрый выбор смены:</label>
        <div class="quick-shift-buttons">
          <button type="button" class="btn-quick" data-shift="1">1 смена <span>(06:00-14:00)</span></button>
          <button type="button" class="btn-quick" data-shift="2">2 смена <span>(14:00-22:00)</span></button>
          <button type="button" class="btn-quick" data-shift="3">3 смена <span>(22:00-06:00)</span></button>
          <button type="button" class="btn-quick btn-off" data-shift="none">Выходной</button>
        </div>

        <hr class="divider">

        <label class="section-label">Точное время работы:</label>
        <div class="time-adjust-grid">
          <div>
            <label style="font-size: 0.75rem; color: var(--text-muted);">Начало:</label>
            <input type="time" id="startTime">
          </div>
          <div>
            <label style="font-size: 0.75rem; color: var(--text-muted);">Конец:</label>
            <input type="time" id="endTime">
          </div>
        </div>

        <div id="overtimePreview" class="overtime-preview">
          Всего: <strong>0 ч</strong>
        </div>
      </div>

      <div class="actions" style="margin-top: 20px;">
        <button type="button" id="modalSaveBtn" class="btn-submit">Применить</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
